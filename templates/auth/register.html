{% extends "base.html" %}
{% block title %}Добавить учителя{% endblock %}

{% block content %}
<div class="topbar">
  <div>
    <div class="page-title">Добавить <span>учителя</span></div>
    <div class="page-subtitle">Создание новой учётной записи</div>
  </div>
  <a href="{{ url_for('admin.teachers') }}" class="btn btn-outline">← Назад</a>
</div>

<div style="max-width:540px">
  <div class="card">
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="reg-fullname">ФИО</label>
        <input class="form-control" type="text" id="reg-fullname" name="full_name"
               placeholder="Иванова Мария Петровна" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-username">Логин</label>
          <input class="form-control" type="text" id="reg-username" name="username"
                 placeholder="ivanova_m" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">Роль</label>
          <select class="form-control" id="reg-role" name="role">
            <option value="teacher">Учитель</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-email">Email</label>
        <input class="form-control" type="email" id="reg-email" name="email"
               placeholder="ivanova@school.ru" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password">Пароль</label>
        <input class="form-control" type="password" id="reg-password" name="password"
               placeholder="Минимум 6 символов" required minlength="6">
      </div>
      <button type="submit" id="btn-create-user" class="btn btn-primary w-full mt-8" style="justify-content:center">
        ✅ Создать пользователя
      </button>
    </form>
  </div>
</div>
{% endblock %}
